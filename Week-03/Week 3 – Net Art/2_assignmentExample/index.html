<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sculpture As 100 Hyperlinks</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
<script>
  // ------------------------------------------------------------------
  // EDIT ME
  // One object per hyperlink on the page:
  //   x, y   -> where it sits on the page, in pixel coordinates
  //   label  -> the clickable text
  //   url    -> where it links to
  //   w, h   -> (optional) popup window size for this link only.
  //             leave them out and it uses defaultWidth/defaultHeight below
  //
  // To add a link: copy any line, change the values, add a comma.
  // To remove a link: delete its line.
 
  let links = [
  { x: 100, y: 80, label: "Poem Library", url: "https://catalogue.nlb.gov.sg/search/card?id=fb50b716-7680-5ad7-af16-4434ef850c02&entityType=FormatGroup", w: 500, h: 400 },
  { x: 100, y: 120, label: "Two friend like sisters", url: "https://catalogue.nlb.gov.sg/search/card?id=fb50b716-7680-5ad7-af16-4434ef850c02&entityType=FormatGroup" },
  { x: 100, y: 140, label: "Heirs eager to fight", url: "https://catalogue.nlb.gov.sg/search/card?id=06e702c2-4759-55f1-8142-8cd79f2ca79f&entityType=FormatGroup", w: 700, h: 500 },
  { x: 100, y: 160, label: "A revolution born", url: "https://catalogue.nlb.gov.sg/search/card?id=f13f65ba-6a24-5a1b-9e3b-30e8214b92d4&entityType=FormatGroup", w: 700, h: 650 },
  { x: 100, y: 180, label: "Born of bloodlines,", url: "https://catalogue.nlb.gov.sg/search/card?id=966d7ffb-6dcd-58ac-9e36-1ed02c147bc2&entityType=FormatGroup" },
  { x: 100, y: 200, label: "Fallen angels and demons,", url: "https://catalogue.nlb.gov.sg/search/card?id=04be1a7c-b0a0-56ca-9673-4399d095c121&entityType=FormatGroup" },
  { x: 100, y: 220, label: "Humans and fairies,", url: "https://catalogue.nlb.gov.sg/search/card?id=251fd0cb-f112-5f91-8349-e548b2e03f62&entityType=FormatGroup"},
  { x: 100, y: 240, label: "Sacrifices and hardships.", url: "https://catalogue.nlb.gov.sg/search/card?id=1b6a7fa2-0404-50d8-b5cd-46973806ba83&entityType=FormatGroup" },
  { x: 100, y: 260, label: "War consumed", url: "https://catalogue.nlb.gov.sg/search/card?id=2a7de823-524c-553a-8335-f89fe298dbe2&entityType=FormatGroup" },
  { x: 100, y: 280, label: "Sisters turned enemies", url: "https://catalogue.nlb.gov.sg/search/card?id=4597d00b-1b8d-5fbe-80b1-a0a887410dc9&entityType=FormatGroup" },
  { x: 100, y: 300, label: "Power and kingdom no more", url: "https://catalogue.nlb.gov.sg/search/card?id=90ee0d65-a47f-59cd-bb6c-943041617617&entityType=FormatGroup" },
  { x: 100, y: 340, label: "to be continued.", url: "https://i.gifer.com/86.gif" },
  ];
  // ------------------------------------------------------------------
  
  // popup size used for any link that doesn't set its own w/h
  let defaultWidth = 500;
  let defaultHeight = 600;

  function setup() {
    noCanvas(); // this page only places links, so we don't need a canvas
    for (let i = 0; i < links.length; i++) {
      let link = links[i];
      let a = createA('javascript:void(0)', link.label);
      a.position(link.x, link.y);
      a.mousePressed(() => openPopup(link));
    }
  }

  // opens a link in its own small popup window
  function openPopup(link) {
    let w = link.w || defaultWidth;
    let h = link.h || defaultHeight;
    window.open(
      link.url,
      '_blank',
      `width=${w},height=${h},left=100,top=50,resizable=yes,scrollbars=yes`
    );
  }

</script>
</body>
</html>
